name: 🌆 build the contribution skyline

on:
  schedule:
    - cron: "40 19 * * *" # ~00:40 PKT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/skyline-settings.json"
      - ".github/workflows/skyline.yml"

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/skyline-settings.json

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "skyline unchanged"
          else
            git commit -m "skyline: rebuild the city"
            git pull --rebase origin main
            git push
          fi
