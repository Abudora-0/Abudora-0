name: 🐍 feed the contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate cozy snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%236b4f3f&color_dots=%23efe8da,%23f3d9b1,%23f2b48c,%23e0876a,%23b5566b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23eb9f9f&color_dots=%232a2540,%235b4a6e,%239c6f7a,%23e0a27a,%23f6c177

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
